<!DOCTYPE html>
<html>
<head>
    <title>Camera App</title>
    <style>
        body {
            font-family: "Comic Sans MS", cursive, sans-serif;
            background-color: #f3e6e6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            background-image: linear-gradient(to right, #007991, #78ffd6); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
            background-size: 400% 400%;
            animation: gradient  5s ease infinite;
            background-attachment: fixed;

        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        #camera-container {
            background-color: white;

        }
        #camera-container {
            margin: 20px 0;
        }
        video {
            width: 100%;
            border: 1px solid #ccc;

        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: rgb(44, 35, 35);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #0056b3;
        }
        #photos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
        }
        #photos img {
            width: 100%;
            height: auto;
            border: 2px solid #fff;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        #photos img:hover {
            transform: scale(1.03);
        }
    
        #camera-container {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
        }
        #camera-container:hover {
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        video {
            width: 100%;
            height: auto;
            border: 1px solid #5a2222;
        }
    </style>
</head>
<body>
    <h1>aplikasi kamera </hassistant> </h1>
    <div id="camera-container">

        <video id="video" autoplay playsinline></video>
    </div>
    <div class="button-container">
        <button id="start">mulai kamera</button>
        <button id="capture">ambil gambar</button>
    </div>
    <div id="photos"></div>
    <div style="margin-top: 20px; text-align: center;">
        <div style="display: inline-block; background: #f5f5f5; padding: 10px; border-radius: 10px;">
            <p style="margin: 0;">Program ini dibuat oleh <a href="https://www.instagram.com/yupiter015?igsh=aTdkcnVlYWc2bGY3" target="_blank">Yupiter</a></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const start = document.getElementById('start');
        const capture = document.getElementById('capture');
        const photos = document.getElementById('photos');
        let stream = null;

        // Start camera
        start.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: true,
                    audio: false 
                });
                video.srcObject = stream;
                start.disabled = true;
                capture.disabled = false;
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        });

        // Capture photo
        capture.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/png');
            photos.appendChild(img);
        });

        // Clean up when leaving page
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
